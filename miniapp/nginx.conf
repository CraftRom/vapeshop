server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Файли зі збірки — тільки як файли. Підставляти замість них
    # index.html із кодом 200 не можна: браузер отримає HTML під імʼям
    # скрипта, не зможе його виконати, і вітрина мовчки не відкриється.
    # Причому 200 кешується — і поломка переживає перерозгортання.
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vite зібрано з base=/app/, тож усі шляхи всередині починаються з /app/.
    # Віддаємо їх із кореня контейнера, знімаючи префікс.
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        # Telegram WebView агресивно тримає HTML вкладки. index.html містить
        # хеші актуальних JS/CSS, тому кешувати саме HTML між деплоями не
        # можна — інакше вікно може ще показувати стару версію Mini App.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Без слеша — теж віддаємо застосунок, а не редиректимо: зайвий
    # перехід ламає передачу підпису в Mini App на Android.
    location = /app {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Той самий запобіжник, що й у панелі: index.html містить імена
    # файлів збірки, тож його кешована копія переживає деплой і питає
    # те, чого вже немає.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Потрібно лише в режимі розробки, коли контейнер відкривають напряму.
    # У проді зовнішній nginx перехоплює /api/ раніше й сюди не доводить.
    location = /api/shop/orders/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 370s;
        send_timeout 370s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
