server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite зібрано з base=/app/, тож усі шляхи всередині починаються з /app/.
    # Віддаємо їх із кореня контейнера, знімаючи префікс.
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # Потрібно лише в режимі розробки, коли контейнер відкривають напряму.
    # У проді зовнішній nginx перехоплює /api/ раніше й сюди не доводить.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
