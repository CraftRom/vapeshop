name: Shop regression QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            miniapp/package-lock.json
            qa/package-lock.json
      - name: Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt -r backend/requirements-qa.txt
      - name: JavaScript dependencies
        run: |
          npm ci --prefix dashboard
          npm ci --prefix miniapp
          npm ci --prefix qa
          cd qa
          npx playwright install --with-deps chromium
      - name: Python and Node regression suites
        env:
          QA_LOG_DIR: ${{ github.workspace }}/qa/output/python
          QA_TIMEOUT_SECONDS: '120'
        run: bash backend/qa/run_all.sh
      - name: Production builds
        run: |
          npm run build --prefix dashboard
          npm run build --prefix miniapp
      - name: Full browser regression
        run: bash qa/run-browser.sh
      - name: QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-qa-logs
          path: qa/output/
          retention-days: 7
