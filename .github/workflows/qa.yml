name: Shop regression QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Known vulnerabilities in the pinned dependencies. A separate job: it names
  # the package and advisory without hiding regression results.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Python runtime dependencies (requirements-lock.txt)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements-lock.txt --progress-spinner off
      - name: Dashboard, Mini App and QA dependencies
        run: |
          for app in dashboard miniapp qa; do
            echo "== $app"
            (cd "$app" && npm audit --audit-level=high)
          done
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: migrations
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d migrations"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            miniapp/package-lock.json
            qa/package-lock.json
      - name: Python dependencies
        run: python -m pip install -r backend/requirements-lock.txt -r backend/requirements-qa.txt
      - name: Migration dependencies
        run: python -m pip install pytest pytest-asyncio pyyaml pgserver==0.1.4
      - name: Migration transactions
        run: |
          export QA_POSTGRES_BIN="$(python -c 'from pathlib import Path; import pgserver; print(Path(pgserver.__file__).parent / "pginstall" / "bin")')"
          PYTHONPATH=backend python -m pytest backend/tests_pytest -q
      - name: Migrations from an empty database and model drift
        # Every revision runs online (data migrations included) on the same
        # PostgreSQL major as production; alembic check fails if the models
        # and the migrated schema disagree.
        env:
          DATABASE_URL: postgresql+asyncpg://qa:qa@127.0.0.1:5432/migrations
        run: |
          cd backend
          python -m alembic upgrade head
          python -m alembic check
      - name: JavaScript dependencies
        run: |
          npm ci --prefix dashboard
          npm ci --prefix miniapp
          npm ci --prefix qa
          cd qa
          npx playwright install --with-deps chromium
      - name: Python and Node regression suites
        env:
          QA_LOG_DIR: ${{ github.workspace }}/qa/output/python
          QA_TIMEOUT_SECONDS: '120'
        run: bash backend/qa/run_all.sh
      - name: Dashboard UI tests
        run: npm test --prefix dashboard
      - name: Production builds
        run: |
          npm run build --prefix dashboard
          npm run build --prefix miniapp
      - name: Full browser regression
        run: bash qa/run-browser.sh
      - name: QA logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shop-qa-logs
          path: qa/output/
          retention-days: 7
