# Розпізнавання сканерів у журналі API.
#
# Кладеться в /etc/fail2ban/filter.d/elfar-recon.conf
#
# Чому по журналу застосунку, а не по логу nginx: у записі API вже є
# розібрана адреса клієнта в полі "ip", узята з X-Real-IP. Перед nginx
# стоїть Cloudflare, тож у його власному логу в $remote_addr буде адреса
# Cloudflare — забанивши її, магазин вимкнеться для всіх одразу.
#
# Правило nginx (return 444) відсікає найгрубішу розвідку до застосунку,
# і ті запити сюди не потрапляють — це навмисно: банити варто за те, що
# правило пропустило, тобто за перебір невідомих шляхів.
#
# Ловимо лише 404. Ані 401, ані 403 сюди не входять: власний менеджер із
# простроченою сесією дає саме 401, і за нього банити не можна.

[Definition]

failregex = ^.*"status": 404.*"ip": "<HOST>".*$
            ^.*"ip": "<HOST>".*"status": 404.*$

# Порядок полів у JSON фіксований форматером, але два варіанти лишаємо
# навмисно: якщо порядок колись зміниться, фільтр не замовкне тихо.

ignoreregex =

datepattern = "time": "%%Y-%%m-%%dT%%H:%%M:%%S
