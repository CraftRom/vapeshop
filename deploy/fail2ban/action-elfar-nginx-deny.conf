# Бан через nginx, а не через фаєрвол хоста.
#
# Кладеться в /etc/fail2ban/action.d/elfar-nginx-deny.conf
# (bootstrap.sh підставляє справжній каталог стека).
#
# Чому не nftables-multiport, як було. Два незалежні шляхи, і обидва
# робили бан порожнім:
#  1. Перед сервером Cloudflare. Пакети до хоста приходять з адрес
#     Cloudflare, а не зі адреси сканера — правило фаєрвола на адресу
#     сканера ніколи не спрацює.
#  2. Порти 80/443 публікує Docker. Такий трафік проходить ланцюжок
#     FORWARD, а nftables-multiport ставить правило в INPUT — повз нього.
#
# Nginx натомість знає справжню адресу (nginx/cloudflare-realip.conf) і
# вміє відмовити саме їй. Список лежить у nginx/deny.d/fail2ban.conf,
# який обидва server-блоки підключають через include.

[Definition]

# Під час старту список очищується: fail2ban сам відновлює активні бани зі
# своєї бази й викликає actionban для кожного. Без очищення в списку
# лишались би адреси, чий бан уже скінчився, поки служба не працювала.
actionstart = mkdir -p "<denydir>"
              : > "<denyfile>"
              <reload>

actionstop = : > "<denyfile>"
             <reload>

actioncheck =

# Точне порівняння рядка, а не регулярний вираз: крапка в IPv4 у regex
# означає «будь-який символ», і unban 1.2.3.4 зачепив би 1.2.3.45 та 102.3.4.x.
actionban = grep -qxF "deny <ip>;" "<denyfile>" || echo "deny <ip>;" >> "<denyfile>"
            <reload>

actionunban = awk -v line="deny <ip>;" '$0 != line' "<denyfile>" > "<denyfile>.tmp" && cat "<denyfile>.tmp" > "<denyfile>" && rm -f "<denyfile>.tmp"
              <reload>

[Init]

stackdir = /opt/elfar
denydir = <stackdir>/deploy/nginx/deny.d
denyfile = <denydir>/fail2ban.conf
# Перевірка перед перезавантаженням: помилка в списку не має покласти
# nginx. `|| true` — бан не повинен падати, якщо стек саме зупинений.
reload = docker compose -f "<stackdir>/deploy/docker-compose.prod.yml" exec -T nginx sh -c "nginx -t -q && nginx -s reload" >/dev/null 2>&1 || true
