# Бан сканерів, які перебирають неіснуючі шляхи.
#
# Кладеться в /etc/fail2ban/jail.d/elfar.conf
#
# Навіщо це поверх обмеження швидкості в nginx. Ліміт там 30 запитів на
# секунду. Сканування 2 вересня йшло 140 запитів за 67 секунд — близько
# двох на секунду, на порядок нижче межі. Повільний перебір проходить
# крізь ліміт швидкості завжди: він міряє темп, а не наміри.
#
# Ознака тут інша й однозначна: тридцять неіснуючих шляхів за десять
# хвилин з однієї адреси. Живий клієнт стільки 404 не набере — вітрина
# ходить фіксованим набором маршрутів.
#
# maxretry свідомо не низький. Один-два 404 буває і в свого: застаріле
# посилання, кеш браузера зі старим шляхом після оновлення вітрини.

[elfar-recon]
enabled  = true
filter   = elfar-recon
# Значення підставляє bootstrap.sh справжнім шляхом до каталогу стека.
# Тут воно лише типове: fail2ban із неіснуючим logpath запускається,
# нічого не читає й нікого не банить — і жодного разу про це не скаже.
logpath  = /opt/elfar/deploy/data/logs/api.log
maxretry = 30
findtime = 10m
bantime  = 24h
# nftables-multiport, а не iptables: на Ubuntu 24 iptables — обгортка над
# nftables, і змішувати їх означає отримати правила, яких не видно в
# `nft list ruleset`.
banaction = nftables-multiport
port     = http,https

# Повторний бан довший. Той, хто вернувся після доби, прийшов навмисно.
[recidive]
enabled  = true
bantime  = 4w
findtime = 1d
maxretry = 3
