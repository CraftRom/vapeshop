# Продакшн-конфігурація для власного сервера.
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
#
# Відмінності від dev-версії:
#   • назовні відкриті лише 80/443, решта — у внутрішній мережі
#   • Redis тримає FSM, тому недооформлені замовлення переживають рестарт
#   • ресурсні ліміти й ротація логів, щоб сервіс не з'їв увесь сервер
#   • схему накочує окремий сервіс migrate, а не кожен інстанс на старті
#   • власний планувальник замість зовнішнього cron: відкладені розсилки
#     й нічні бекапи живуть у тому ж коді, що й магазин

# Збірка бекенду. Один і той самий образ для migrate, api, bot і scheduler —
# різниця лише в команді. UID/GID приходять із .env і мають збігатися
# з користувачем shop на хості, інакше бекапи в ./backups стануть чужими.
x-backend-build: &backend-build
  context: ../backend
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      sh -c 'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks: [internal]

  # Накочує міграції й завершується. Решта сервісів чекає на успішний вихід.
  migrate:
    build: *backend-build
    command: alembic upgrade head
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal]

  api:
    volumes:
      - ./data/logs:/data/logs
      - ./data/media:/data/media
      - ./data/backups:/data/backups
    build: *backend-build
    restart: always
    command: >
      uvicorn api.main:app
      --host 0.0.0.0 --port 8000
      --workers 1
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 1G}
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal, promo_control]

  bot:
    volumes:
      - ./data/logs:/data/logs
    build: *backend-build
    restart: always
    command: python -m bot
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: {memory: 1G}
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal]

  # Планувальник: розсилки, SalesDrive retry/read, бекапи й retention.
  #
  # Окремий контейнер, а не фоновий таск усередині API: API перезапускається
  # при кожному деплої і масштабується воркерами, і розсилка або поїхала б
  # двічі, або обірвалася б посеред черги.
  scheduler:
    build: *backend-build
    command: python -m scheduler
    restart: always
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./data/logs:/data/logs
      - ./data/backups:/data/backups
    deploy:
      resources:
        limits: {memory: 512M}
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal]

  dashboard:
    build: ../dashboard
    restart: always
    depends_on: [api]
    logging: *default-logging
    networks: [internal]

  # Вітрина Telegram Mini App. Окремий контейнер, бо збірка йде з base=/app/
  # і змішувати її зі статикою панелі не можна.
  miniapp:
    build: ../miniapp
    restart: always
    depends_on: [api]
    logging: *default-logging
    networks: [internal]

  # Єдина точка входу ззовні. Термінує TLS, роздає статику, проксює API.
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ratelimit.conf:/etc/nginx/conf.d/00-ratelimit.conf:ro
      # Справжня адреса покупця з-за Cloudflare. Без неї ліміти, журнал і
      # бани працюють з адресою вузла Cloudflare, спільною для всіх.
      - ./nginx/cloudflare-realip.conf:/etc/nginx/conf.d/01-cloudflare-realip.conf:ro
      - ./nginx/generated/app.conf:/etc/nginx/conf.d/default.conf:ro
      - promo-nginx-conf:/etc/nginx/promo.d:ro
      # Читання, не запис: nginx лише віддає файли, кладе їх API.
      - ./data/media:/data/media:ro
      # HSTS вмикається лише після появи справжнього сертифіката.
      # Порт 80 завжди лишається ACME + HTTPS redirect.
      - ./nginx/hsts.d:/etc/nginx/hsts.d:ro
      # Список банів fail2ban. Каталог, а не файл: fail2ban переписує файл
      # через тимчасовий, і змонтований окремо файл лишився б старим.
      - ./nginx/deny.d:/etc/nginx/deny.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on: [dashboard, miniapp, api]
    logging: *default-logging
    networks: [internal]

  # Ізольований контролер промо-доменів. Він НЕ має Docker socket,
  # не бачить основну БД і не приймає зовнішні з’єднання. API звертається
  # до нього тільки через окрему internal network. Для reload він ділить
  # PID namespace лише з nginx і має єдину capability KILL.
  promo-controller:
    build: ./promo-controller
    restart: always
    environment:
      PROMO_CONTROLLER_TOKEN: ${PROMO_CONTROLLER_TOKEN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      PROMO_PUBLIC_IPV4: ${PROMO_PUBLIC_IPV4:-}
      PROMO_PUBLIC_IPV6: ${PROMO_PUBLIC_IPV6:-}
      PROMO_PUBLIC_IP_CACHE_SECONDS: ${PROMO_PUBLIC_IP_CACHE_SECONDS:-600}
      PROMO_CONTROLLER_PORT: 8787
    volumes:
      - promo-nginx-conf:/promo-conf
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    pid: "service:nginx"
    depends_on: [nginx]
    networks: [promo_control, promo_egress]
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add: ["KILL"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Helper-контейнер для bootstrap/certbot-init.sh. Автоматичне renew +
    # reload nginx тепер виконує ізольований promo-controller.
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do sleep 86400 & wait $${!}; done"]
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  certbot-www:
  certbot-conf:
  promo-nginx-conf:

networks:
  internal:
  promo_control:
    internal: true
  promo_egress:
    # Лише вихід promo-controller до DNS/Let's Encrypt. Портів назовні немає.
