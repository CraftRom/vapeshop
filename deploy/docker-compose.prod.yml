# Продакшн-конфігурація для власного сервера.
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
#
# Відмінності від dev-версії:
#   • назовні відкриті лише 80/443, решта — у внутрішній мережі
#   • Redis тримає FSM, тому недооформлені замовлення переживають рестарт
#   • ресурсні ліміти й ротація логів, щоб сервіс не з'їв увесь сервер
#   • схему накочує окремий сервіс migrate, а не кожен інстанс на старті
#   • власний планувальник замість зовнішнього cron: відкладені розсилки
#     й нічні бекапи живуть у тому ж коді, що й магазин

# Збірка бекенду. Один і той самий образ для migrate, api, bot і scheduler —
# різниця лише в команді. UID/GID приходять із .env і мають збігатися
# з користувачем shop на хості, інакше бекапи в ./backups стануть чужими.
x-backend-build: &backend-build
  context: ../backend
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    networks: [internal]

  # Накочує міграції й завершується. Решта сервісів чекає на успішний вихід.
  migrate:
    build: *backend-build
    command: alembic upgrade head
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks: [internal]

  api:
    build: *backend-build
    restart: always
    command: >
      uvicorn api.main:app
      --host 0.0.0.0 --port 8000
      --workers 2 --proxy-headers --forwarded-allow-ips='*'
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {memory: 512M}
    logging: *default-logging
    networks: [internal]

  bot:
    build: *backend-build
    restart: always
    command: python -m bot
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits: {memory: 512M}
    logging: *default-logging
    networks: [internal]

  # Планувальник: відкладені розсилки й бекапи бази.
  #
  # Окремий контейнер, а не фоновий таск усередині API: API перезапускається
  # при кожному деплої і масштабується воркерами, і розсилка або поїхала б
  # двічі, або обірвалася б посеред черги.
  scheduler:
    build: *backend-build
    command: python -m scheduler
    restart: always
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    deploy:
      resources:
        limits: {memory: 256M}
    logging: *default-logging
    networks: [internal]

  dashboard:
    build: ../dashboard
    restart: always
    depends_on: [api]
    logging: *default-logging
    networks: [internal]

  # Вітрина Telegram Mini App. Окремий контейнер, бо збірка йде з base=/app/
  # і змішувати її зі статикою панелі не можна.
  miniapp:
    build: ../miniapp
    restart: always
    depends_on: [api]
    logging: *default-logging
    networks: [internal]

  # Єдина точка входу ззовні. Термінує TLS, роздає статику, проксює API.
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ratelimit.conf:/etc/nginx/conf.d/00-ratelimit.conf:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on: [dashboard, miniapp, api]
    logging: *default-logging
    networks: [internal]

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Перевіряє сертифікат двічі на добу й оновлює за 30 днів до кінця
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  certbot-www:
  certbot-conf:

networks:
  internal:
