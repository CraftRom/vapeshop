# Справжня адреса покупця з-за Cloudflare.
#
# Монтується як /etc/nginx/conf.d/01-cloudflare-realip.conf (http-контекст,
# після 00-ratelimit.conf і до default.conf).
#
# Без цього файлу $remote_addr у nginx — адреса вузла Cloudflare, а не
# покупця. Наслідки були тихі, але важкі:
#  - X-Real-IP, який читає застосунок, теж ставав адресою Cloudflare, і в
#    журналі безпеки жодна подія не мала справжнього IP;
#  - ліміти limit_req рахувались на вузол Cloudflare, тобто спільно для
#    всіх покупців, що йдуть через нього: 20 записів діагностики на
#    хвилину ділили між собою всі відкриті вітрини міста;
#  - fail2ban отримував адресу Cloudflare, і бан вимкнув би магазин для
#    всіх одразу.
#
# Заголовку CF-Connecting-IP довіряємо ЛИШЕ від адрес Cloudflare. Запит
# напряму на origin із підробленим заголовком лишиться зі своєю справжньою
# адресою — підмінити IP так неможливо.
#
# Список — офіційний, https://www.cloudflare.com/ips/ (15 IPv4, 7 IPv6).
# Оновлення: deploy/update-cloudflare-ips.sh. Змінюється він рідко, але
# застарілий список дає рівно ту саму поломку для нових вузлів.

# --- IPv4 ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# --- IPv6 ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
