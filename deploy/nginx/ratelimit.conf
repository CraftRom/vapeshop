# Зони лімітів мають бути в http-контексті, тому окремим файлом.
# Монтується як /etc/nginx/conf.d/00-ratelimit.conf (префікс 00 — щоб
# завантажився раніше за app.conf, який на ці зони посилається).

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
