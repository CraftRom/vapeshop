# Замініть example.com на свій домен (він же має бути в PUBLIC_URL у .env).
#
# Перший запуск робиться без TLS: сертифіката ще немає, і nginx з блоком 443
# просто не стартує. Порядок дій — у docs/SERVER.md.

upstream api_backend {
    server api:8000;
}

upstream miniapp_static {
    server miniapp:80;
}

upstream dashboard_static {
    server dashboard:80;
}

# ------------------------------------------------------------------------ HTTP
#
# Порт 80 не просто редіректить на HTTPS, а вміє віддавати сайт сам.
#
# Причина: поки справжнього сертифіката немає, HTTPS показує браузеру
# попередження про підроблений сайт, і магазин недоступний узагалі. Краще
# віддати його незашифрованим, ніж не віддати ніяк. Щойно Let's Encrypt
# видасть сертифікат, certbot-init.sh кладе файл у redirect.d/, і порт 80
# знову стає лише перенаправленням.
server {
    listen 80;
    server_name example.com www.example.com;

    # Цей шлях має лишатись на HTTP — через нього certbot підтверджує домен
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10M;

    location / {
        # Порожня тека — включення просто нічого не додає, і сайт віддається
        # по HTTP. З файлом усередині тут зʼявляється redirect на HTTPS.
        include /etc/nginx/redirect.d/*.conf;

        proxy_pass http://dashboard_static;
        proxy_set_header Host $host;
    }

    location /app {
        include /etc/nginx/redirect.d/*.conf;
        proxy_pass http://miniapp_static;
        proxy_set_header Host $host;
    }

    location /api/ {
        include /etc/nginx/redirect.d/*.conf;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Вебхук Telegram лишається доступним по HTTP завжди: Telegram сам
    # ходить тільки по HTTPS, але внутрішні перевірки зручніше робити тут.
    location ~ ^/api/telegram/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS вмикається лише зі справжнім сертифікатом: інакше браузер
    # запамʼятає домен як «тільки HTTPS», і запасний варіант по HTTP
    # перестане працювати саме тоді, коли він потрібен.
    include /etc/nginx/hsts.d/*.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Вебхук Telegram: без ліміту швидкості, інакше загубимо апдейти в піках
    location ~ ^/api/telegram/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Захист від перебору пароля до панелі
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Вітрина Mini App. Має стояти перед кореневим location, інакше
    # запити з'їдала б панель.
    location /app {
        proxy_pass http://miniapp_static;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://dashboard_static;
        proxy_set_header Host $host;
    }
}
