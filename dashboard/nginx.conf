server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Файли зі збірки — тільки як файли.
    #
    # Найдорожчий рядок у цьому конфізі — той, якого тут раніше не було.
    # Загальне правило нижче підставляє index.html замість будь-якого
    # ненайденого шляху, і робить це з кодом 200. Для маршрутів це
    # правильно: /orders має відкрити застосунок. Для файлу зі збірки —
    # згубно: браузер просить Orders-XXXX.js, отримує сторінку HTML із
    # кодом «усе гаразд» і не може її виконати. Сторінка не відкривається,
    # у журналі сервера жодної помилки, бо з його боку це успішна
    # відповідь. Гірше того — 200 придатний до кешування, тож проксі
    # запамʼятовує HTML під імʼям скрипта, і поломка переживає
    # перерозгортання.
    #
    # =404 повертає чесну відсутність: її видно і в журналі, і в консолі
    # браузера, і кешувати її ніхто не стане.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        # Імʼя файлу містить хеш вмісту: змінився файл — змінилось імʼя.
        # Тому кеш безпечно тримати довгим.
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # А ось index.html кешувати не можна взагалі. Саме він містить імена
    # файлів збірки, і вкладка, яка завантажила стару його версію, потім
    # питає файли, яких на сервері вже немає.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
